
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PawsPath | Premium Pet Transport</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Typography Option C: Editorial Warm -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Source+Serif+4:ital,opsz,wght@0,8,600;0,8,700;1,8,600&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Palette 2: Midnight + Clay Tokens */
        --midnight: #0B1020;
        --cream: #F7F1E8;
        --clay: #C86B4A;
        --sage: #6B8F71;
        --slate: #2A3346;
        --fog: #E6E0D8;
        
        /* Typography Scale */
        --h1: clamp(40px, 5vw, 72px);
        --h2: clamp(32px, 3.5vw, 48px);
        --h3: clamp(28px, 3vw, 32px);
        --h4: 22px;
        --body-l: 18px;
        --body: 16px;
        --small: 14px;
      }

      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--cream);
        color: var(--midnight);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      h1, h2, .font-serif {
        font-family: 'Source Serif 4', serif;
        letter-spacing: -0.02em;
      }

      .text-h1 { font-size: var(--h1); line-height: 1.05; font-weight: 700; }
      .text-h2 { font-size: var(--h2); line-height: 1.15; font-weight: 650; }
      .text-h3 { font-size: var(--h3); line-height: 1.2; font-weight: 600; }
      .text-h4 { font-size: var(--h4); line-height: 1.3; font-weight: 600; }
      .text-body-l { font-size: var(--body-l); line-height: 1.6; font-weight: 400; }
      .text-body { font-size: var(--body); line-height: 1.65; font-weight: 400; }
      .text-small { font-size: var(--small); line-height: 1.55; font-weight: 500; }

      .glass {
        background: rgba(247, 241, 232, 0.7);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(11, 16, 32, 0.05);
      }

      .section-padding { padding-top: 80px; padding-bottom: 80px; }
      @media (min-width: 768px) {
        .section-padding { padding-top: 120px; padding-bottom: 120px; }
      }

      /* Card & Interactive Styles */
      .card-3d-wrap { perspective: 1500px; }
      .card-3d {
        transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        transform-style: preserve-3d;
      }
      .card-3d:hover { transform: translateY(-8px) rotateX(2deg) rotateY(-2deg); }
      
      .btn-primary {
        background-color: var(--clay);
        color: var(--cream);
        font-weight: 600;
        transition: all 0.3s ease;
      }
      .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

      .route-line-anim {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: dash 8s ease-in-out forwards infinite;
      }
      @keyframes dash { to { stroke-dashoffset: 0; } }
      
      .floating { animation: float 6s ease-in-out infinite; }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-12px); }
      }

      .marquee-container { overflow: hidden; white-space: nowrap; width: 100%; display: flex; }
      .marquee-content { display: flex; animation: scroll 40s linear infinite; }
      @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
        "react/": "https://esm.sh/react@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4",
        "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
        "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "recharts": "https://esm.sh/recharts@^3.7.0"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
